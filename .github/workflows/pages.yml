name: Deploy GitHub Pages site

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-publication
  cancel-in-progress: false

jobs:
  validate:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required site files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s biography.html
          test -s styles.css
          test -s script.js
          test -s assets/favicon.svg
          test -s assets/social-card.svg
          test -s assets/harry-portrait.jpg
          grep -q '<main id="main-content">' index.html
          grep -q '<main id="main-content">' biography.html
          grep -q 'prefers-reduced-motion' styles.css

  deploy:
    if: >-
      !cancelled() &&
      (needs.validate.result == 'success' || github.event.action == 'closed') &&
      ((github.event_name != 'pull_request' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Prepare site files
        env:
          REMOVE_PREVIEW: ${{ github.event.action == 'closed' }}
          IS_PREVIEW: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir site
          if [ "$REMOVE_PREVIEW" != "true" ]; then
            cp index.html biography.html styles.css script.js site/
            cp -R assets site/assets
            if [ "$IS_PREVIEW" = "true" ]; then
              for page in site/*.html; do
                awk '{ print } /<head>/ { print "    <meta name=\"robots\" content=\"noindex, nofollow\">" }' "$page" > "$page.tmp"
                mv "$page.tmp" "$page"
              done
            fi
          fi

      - name: Update production or PR preview files
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4
        with:
          branch: gh-pages
          folder: site
          target-folder: ${{ github.event_name == 'pull_request' && format('pr-preview/pr-{0}', github.event.number) || '' }}
          clean: true
          clean-exclude: ${{ github.event_name != 'pull_request' && 'pr-preview/***' || '' }}
          force: false

      - name: Check out the complete published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: publication
          persist-credentials: false

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: publication

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Update PR preview link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        with:
          script: |
            const marker = '<!-- rhuyees-roost-pr-preview -->';
            const issue_number = context.issue.number;
            const previewUrl = `${process.env.PAGES_URL.replace(/\/$/, '')}/pr-preview/pr-${issue_number}/`;
            const body = context.payload.action === 'closed'
              ? `${marker}\nPreview removed because this pull request is closed.`
              : `${marker}\nPreview ready: [View this PR's website](${previewUrl})\n\nUpdated for commit \`${context.payload.pull_request.head.sha.slice(0, 7)}\`.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number,
            });
            const existing = comments.find(comment =>
              comment.user.login === 'github-actions[bot]' && comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number,
                body,
              });
            }
            await core.summary
              .addHeading('PR preview')
              .addRaw(context.payload.action === 'closed' ? 'Preview removed.' : previewUrl)
              .write();
